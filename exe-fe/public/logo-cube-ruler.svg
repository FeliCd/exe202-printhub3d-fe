<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient: Deep Cyber Navy / Dark Black (Xanh Đen) -->
    <radialGradient id="rulerBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0c1626" />
      <stop offset="55%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#030508" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradients for 3D Ruler and Cube -->
    <linearGradient id="rulerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <linearGradient id="neonGreenStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#39ff14" />
    </linearGradient>

    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Dark Cyber-Navy Canvas Background -->
  <rect width="512" height="512" rx="64" fill="url(#rulerBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Subtle Blueprint Tech Grid in Background -->
  <g stroke="#38bdf8" stroke-opacity="0.05" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="512" />
    <line x1="168" y1="0" x2="168" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="344" y1="0" x2="344" y2="512" />
    <line x1="432" y1="0" x2="432" y2="512" />
    <line x1="0" y1="100" x2="512" y2="100" />
    <line x1="0" y1="200" x2="512" y2="200" />
    <line x1="0" y1="300" x2="512" y2="300" />
    <line x1="0" y1="400" x2="512" y2="400" />
  </g>

  <!-- ======================================================== -->
  <!-- 1. CÂY THƯỚC KỸ THUẬT GÓC 3D (ISOMETRIC CORNER RULER)     -->
  <!-- ======================================================== -->
  <!-- 
       A specialized multi-axis precision engineering ruler.
       Hugs the 3D isometric cube, measuring X, Y, and Z dimensions with millimeter graduations.
  -->
  <g id="technical-ruler" filter="url(#glowGreen)">
    <!-- Main Ruler Solid Body Path (3D Angle / Caliper Structure) -->
    <!-- Top-vertical arm + Bottom angled arms -->
    <path d="
      M 256,92 
      L 156,150 
      L 156,270 
      L 256,328 
      L 356,270 
      L 356,242 
      L 256,300 
      L 184,258 
      L 184,166 
      L 256,124 
      Z" 
      fill="url(#rulerGrad)" 
      stroke="url(#neonGreenStroke)" 
      stroke-width="3" 
      stroke-linejoin="round"
    />

    <!-- Secondary outer bevel flange for realistic technical ruler feel -->
    <path d="
      M 256,84 
      L 146,148 
      L 146,276 
      L 256,340 
      L 366,276" 
      fill="none" 
      stroke="#10b981" 
      stroke-width="1.2" 
      stroke-opacity="0.5"
    />

    <!-- ======================================================== -->
    <!-- MILLIMETER GRADUATION TICKS ON RULER (VẠCH THƯỚC KỸ THUẬT)-->
    <!-- ======================================================== -->
    
    <!-- LEFT-TOP ARM TICKS (Measuring along slope from 256,124 to 184,166) -->
    <g stroke="#39ff14" stroke-width="1.6" stroke-linecap="round">
      <!-- Major 10mm Ticks -->
      <line x1="246" y1="118" x2="251" y2="110" stroke-width="2.2" stroke="#22d3ee" />
      <line x1="228" y1="128" x2="233" y2="120" stroke-width="2" />
      <line x1="210" y1="139" x2="215" y2="131" stroke-width="2" />
      <line x1="192" y1="149" x2="197" y2="141" stroke-width="2.2" stroke="#22d3ee" />

      <!-- Intermediate 5mm Ticks -->
      <line x1="237" y1="123" x2="241" y2="117" stroke-width="1.4" />
      <line x1="219" y1="134" x2="223" y2="127" stroke-width="1.4" />
      <line x1="201" y1="144" x2="205" y2="138" stroke-width="1.4" />

      <!-- Minor 1mm Ticks -->
      <line x1="242" y1="120" x2="245" y2="116" stroke-width="1" stroke-opacity="0.8" />
      <line x1="233" y1="125" x2="236" y2="121" stroke-width="1" stroke-opacity="0.8" />
      <line x1="224" y1="131" x2="227" y2="126" stroke-width="1" stroke-opacity="0.8" />
      <line x1="215" y1="136" x2="218" y2="132" stroke-width="1" stroke-opacity="0.8" />
      <line x1="206" y1="141" x2="209" y2="137" stroke-width="1" stroke-opacity="0.8" />
      <line x1="197" y1="146" x2="200" y2="142" stroke-width="1" stroke-opacity="0.8" />
    </g>

    <!-- VERTICAL LEFT ARM TICKS (Measuring vertical height from 184,166 down to 184,258) -->
    <g stroke="#39ff14" stroke-width="1.6" stroke-linecap="round">
      <!-- Major 10mm Ticks -->
      <line x1="184" y1="176" x2="170" y2="176" stroke-width="2.2" stroke="#22d3ee" />
      <line x1="184" y1="198" x2="172" y2="198" stroke-width="2" />
      <line x1="184" y1="220" x2="172" y2="220" stroke-width="2" />
      <line x1="184" y1="242" x2="170" y2="242" stroke-width="2.2" stroke="#22d3ee" />

      <!-- 5mm Intermediate Ticks -->
      <line x1="184" y1="187" x2="175" y2="187" stroke-width="1.4" />
      <line x1="184" y1="209" x2="175" y2="209" stroke-width="1.4" />
      <line x1="184" y1="231" x2="175" y2="231" stroke-width="1.4" />
      <line x1="184" y1="253" x2="175" y2="253" stroke-width="1.4" />

      <!-- 1mm Minor Ticks -->
      <line x1="184" y1="180" x2="178" y2="180" stroke-width="1" stroke-opacity="0.75" />
      <line x1="184" y1="184" x2="178" y2="184" stroke-width="1" stroke-opacity="0.75" />
      <line x1="184" y1="191" x2="178" y2="191" stroke-width="1" stroke-opacity="0.75" />
      <line x1="184" y1="194" x2="178" y2="194" stroke-width="1" stroke-opacity="0.75" />
      <line x1="184" y1="202" x2="178" y2="202" stroke-width="1" stroke-opacity="0.75" />
      <line x1="184" y1="205" x2="178" y2="205" stroke-width="1" stroke-opacity="0.75" />
      <line x1="184" y1="213" x2="178" y2="213" stroke-width="1" stroke-opacity="0.75" />
      <line x1="184" y1="216" x2="178" y2="216" stroke-width="1" stroke-opacity="0.75" />
      <line x1="184" y1="224" x2="178" y2="224" stroke-width="1" stroke-opacity="0.75" />
      <line x1="184" y1="227" x2="178" y2="227" stroke-width="1" stroke-opacity="0.75" />
      <line x1="184" y1="235" x2="178" y2="235" stroke-width="1" stroke-opacity="0.75" />
      <line x1="184" y1="238" x2="178" y2="238" stroke-width="1" stroke-opacity="0.75" />
      <line x1="184" y1="246" x2="178" y2="246" stroke-width="1" stroke-opacity="0.75" />
      <line x1="184" y1="249" x2="178" y2="249" stroke-width="1" stroke-opacity="0.75" />
    </g>

    <!-- BOTTOM-RIGHT ARM TICKS (Measuring along slope from 256,300 to 356,242) -->
    <g stroke="#39ff14" stroke-width="1.6" stroke-linecap="round">
      <!-- Major 10mm Ticks -->
      <line x1="266" y1="294" x2="271" y2="303" stroke-width="2.2" stroke="#22d3ee" />
      <line x1="288" y1="281" x2="293" y2="290" stroke-width="2" />
      <line x1="310" y1="268" x2="315" y2="277" stroke-width="2" />
      <line x1="332" y1="256" x2="337" y2="265" stroke-width="2.2" stroke="#22d3ee" />

      <!-- 5mm Ticks -->
      <line x1="277" y1="287" x2="281" y2="294" stroke-width="1.4" />
      <line x1="299" y1="275" x2="303" y2="282" stroke-width="1.4" />
      <line x1="321" y1="262" x2="325" y2="269" stroke-width="1.4" />
      <line x1="343" y1="250" x2="347" y2="257" stroke-width="1.4" />

      <!-- 1mm Ticks -->
      <line x1="270" y1="292" x2="273" y2="297" stroke-width="1" stroke-opacity="0.75" />
      <line x1="274" y1="289" x2="277" y2="294" stroke-width="1" stroke-opacity="0.75" />
      <line x1="282" y1="284" x2="285" y2="289" stroke-width="1" stroke-opacity="0.75" />
      <line x1="285" y1="283" x2="288" y2="288" stroke-width="1" stroke-opacity="0.75" />
      <line x1="293" y1="278" x2="296" y2="283" stroke-width="1" stroke-opacity="0.75" />
      <line x1="296" y1="276" x2="299" y2="281" stroke-width="1" stroke-opacity="0.75" />
      <line x1="304" y1="271" x2="307" y2="276" stroke-width="1" stroke-opacity="0.75" />
      <line x1="307" y1="270" x2="310" y2="275" stroke-width="1" stroke-opacity="0.75" />
      <line x1="315" y1="265" x2="318" y2="270" stroke-width="1" stroke-opacity="0.75" />
      <line x1="318" y1="263" x2="321" y2="268" stroke-width="1" stroke-opacity="0.75" />
      <line x1="326" y1="259" x2="329" y2="264" stroke-width="1" stroke-opacity="0.75" />
      <line x1="329" y1="257" x2="332" y2="262" stroke-width="1" stroke-opacity="0.75" />
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 2. KHỐI LẬP PHƯƠNG 3D PHÁT SÁNG (ISOMETRIC 3D CUBE)       -->
  <!-- ======================================================== -->
  <!-- Floating precision cube measured accurately by the ruler -->
  <g id="3d-cube" filter="url(#glowCyan)" transform="translate(256, 210)">
    <!-- Top Face -->
    <polygon points="0,-64 56,-32 0,0 -56,-32" fill="url(#cubeTop)" stroke="#38bdf8" stroke-width="2.5" />
    
    <!-- Left Face -->
    <polygon points="-56,-32 0,0 0,64 -56,32" fill="url(#cubeLeft)" stroke="#0284c7" stroke-width="2.5" />
    
    <!-- Right Face -->
    <polygon points="0,0 56,-32 56,32 0,64" fill="url(#cubeRight)" stroke="#22d3ee" stroke-width="2.5" />

    <!-- Internal Isometric Core Lines (Wireframe CAD Look) -->
    <g stroke="#ffffff" stroke-width="1" stroke-opacity="0.6">
      <line x1="0" y1="0" x2="0" y2="-64" />
      <line x1="0" y1="0" x2="-56" y2="32" />
      <line x1="0" y1="0" x2="56" y2="32" />
    </g>

    <!-- Center Laser Convergence Point (Gốc tọa độ 0.1mm) -->
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
    <circle cx="0" cy="0" r="7" fill="#39ff14" opacity="0.8" />
  </g>

  <!-- ======================================================== -->
  <!-- 3. BRAND TYPOGRAPHY / CHỮ THƯƠNG HIỆU PRINTHUB 3D        -->
  <!-- ======================================================== -->
  <g transform="translate(256, 420)" text-anchor="middle">
    <!-- Brand Name: PRINTHUB 3D -->
    <text y="0" font-family="'Montserrat', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="3">
      <tspan fill="#ffffff">PRINTHUB </tspan>
      <tspan fill="#39ff14" filter="url(#glowGreen)">3D</tspan>
    </text>

    <!-- Tagline: PRECISION & 3D PRINTING -->
    <text y="24" fill="#94a3b8" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" letter-spacing="4">
      PRECISION &amp; 3D PRINTING
    </text>

    <!-- Sub-tagline: Thước Kỹ Thuật Sinh Viên & Xưởng In -->
    <text y="42" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" letter-spacing="2" opacity="0.8">
      ±0.1MM TOLERANCE • LASER CNC
    </text>
  </g>
</svg>
